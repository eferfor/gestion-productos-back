<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">
	<head>
	    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <title>Catálogo</title>
        <link rel="stylesheet" type="text/css" href="css/catalogo.css" /> 
	</head>
	<body>
	   <h1>Catálogo de productos</h1>
        <div class="lista">
            <table class="producto" th:each="producto, iterStat: ${productos}">
                <tr>
	                <td rowspan="4" class="imagen">
	                    <img th:src="${producto.imagen}" th:alt="${producto.nombre}" />
	                </td>
	                <td><h2 th:text="${producto.nombre}"></h2></td>
	            </tr>
	            <tr>
	                <td><h3 th:text="${producto.marca} "> <span th:text="· ${producto.nombre}"></span></h3></td>
	            </tr>
	            <tr>
	                <td class="datos">
	                    <p th:text="${producto.descripcion}"></p>
	                    <p class="precio" th:text="${producto.precio + '€'}"></p>
	                </td>
	            </tr>
	            <tr>
	                <td class="categoria"><p th:text="${producto.categoria}"></p></td>
	            </tr>
            </table>
        </div>
	</body>
</html>
